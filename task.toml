schema_version = "1.4"
# Harbor 0.24 的本地 Docker provider 不支持 no-network；题目自身不依赖网络，
# Dockerfile 已用 --network=none 验证离线构建，运行程序与评分依赖也均为离线可用。
allow_internet = true

[task]
name = "xyj/neo-tracklet-arc-audit"
version = "0.3.0"
description = "审计近地小天体短弧观测，完成地心视差联合反演与候选星历关联。"
authors = [{ name = "xyj" }]
keywords = ["astronomy", "near-earth-object", "astrometry", "parallax", "catalog-association"]

[metadata]
difficulty = "hard"
category = "astronomy"
tags = ["astrometry", "geocentric-parallax", "orbit-linking"]
expert_time_estimate_min = 120
junior_time_estimate_min = 300

[environment]
dockerfile = "environment/Dockerfile"
network_mode = "public"

[agent]
user = "runner"
timeout_sec = 900
network_mode = "public"

[verifier]
user = "root"
timeout_sec = 240
environment_mode = "shared"
network_mode = "public"
