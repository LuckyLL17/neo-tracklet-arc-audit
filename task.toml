schema_version = "1.4"
# 本题不需要外网；运行与验证均在离线策略下执行。
allow_internet = false

[task]
name = "xyj/neo-tracklet-arc-audit"
version = "0.3.0"
description = "审计近地小天体短弧观测，完成地心视差联合反演与候选星历关联。"
authors = [{ name = "xyj" }]
keywords = ["astronomy", "near-earth-object", "astrometry", "parallax", "catalog-association"]

[metadata]
difficulty = "hard"
category = "astronomy"
tags = ["astrometry", "geocentric-parallax", "orbit-linking"]
expert_time_estimate_min = 120
junior_time_estimate_min = 300

[environment]
dockerfile = "environment/Dockerfile"
network_mode = "no-network"

[agent]
user = "runner"
timeout_sec = 900
network_mode = "no-network"

[verifier]
user = "root"
timeout_sec = 240
environment_mode = "shared"
network_mode = "no-network"
